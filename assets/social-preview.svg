<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Grocery Shopping Agent</title>
  <desc id="description">A colorful social preview showing a delivery-aware grocery basket, deals, and smart substitutions.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#082f49"/>
      <stop offset="0.48" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="bag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#022c22" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0f766e"/>
  <circle cx="1130" cy="70" r="250" fill="#ffffff" opacity="0.055"/>
  <circle cx="1160" cy="610" r="290" fill="#bef264" opacity="0.06"/>
  <circle cx="70" cy="650" r="220" fill="#ffffff" opacity="0.04"/>

  <g transform="translate(78 92)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="38" fill="#ecfccb" font-size="21" font-weight="700" letter-spacing="3">AN APPROVAL-GATED AGENTIC SKILL</text>
    <text x="0" y="120" fill="#ffffff" font-size="64" font-weight="800">Grocery Shopping</text>
    <text x="0" y="190" fill="#ffffff" font-size="64" font-weight="800">Agent</text>
    <text x="0" y="246" fill="#d1fae5" font-size="26">Find the best delivered basket.</text>
    <text x="0" y="284" fill="#d1fae5" font-size="26">Surface real deals. Suggest smarter swaps.</text>

    <g transform="translate(0 332)" font-size="17" font-weight="700">
      <rect width="184" height="48" rx="24" fill="#ffffff" opacity="0.16"/>
      <text x="22" y="30" fill="#ffffff">Delivery-aware</text>
      <g transform="translate(198 0)">
        <rect width="154" height="48" rx="24" fill="#ffffff" opacity="0.16"/>
        <text x="22" y="30" fill="#ffffff">Deal hunter</text>
      </g>
      <g transform="translate(366 0)">
        <rect width="154" height="48" rx="24" fill="#ffffff" opacity="0.16"/>
        <text x="22" y="30" fill="#ffffff">Smart swaps</text>
      </g>
    </g>
    <text x="0" y="448" fill="#bbf7d0" font-size="18" font-weight="700">github.com/lukegeel101/grocery-shopping-agent-skill</text>
  </g>

  <g transform="translate(856 158) scale(1.18)" filter="url(#shadow)">
    <path d="M56 76h214l-18 250H74z" fill="#f59e0b"/>
    <path d="M104 92c0-62 118-62 118 0" fill="none" stroke="#fef3c7" stroke-width="18" stroke-linecap="round"/>
    <path d="M128 90c-8-42 18-78 48-82 6 42-8 72-48 82z" fill="#84cc16"/>
    <path d="M183 88c10-46 49-66 79-55-10 42-37 61-79 55z" fill="#22c55e"/>
    <circle cx="112" cy="174" r="31" fill="#ef4444"/>
    <path d="M110 144c4-12 15-18 25-19" fill="none" stroke="#14532d" stroke-width="7" stroke-linecap="round"/>
    <rect x="164" y="146" width="52" height="92" rx="16" fill="#f8fafc"/>
    <rect x="176" y="162" width="28" height="10" rx="5" fill="#38bdf8"/>
    <path d="M220 246c0-46 48-73 84-49-1 46-43 77-84 49z" fill="#a3e635"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0f172a" filter="url(#shadow)">
    <g transform="translate(804 80)">
      <rect width="190" height="54" rx="16" fill="#ffffff"/>
      <circle cx="27" cy="27" r="10" fill="#22c55e"/>
      <text x="48" y="33">Best total found</text>
    </g>
    <g transform="translate(1052 180)">
      <rect width="178" height="54" rx="16" fill="#ffffff"/>
      <circle cx="27" cy="27" r="10" fill="#f59e0b"/>
      <text x="48" y="33">Coupon verified</text>
    </g>
    <g transform="translate(764 500)">
      <rect width="194" height="54" rx="16" fill="#ffffff"/>
      <circle cx="27" cy="27" r="10" fill="#38bdf8"/>
      <text x="48" y="33">Swap for review</text>
    </g>
  </g>
</svg>
