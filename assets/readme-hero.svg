<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Grocery Shopping Agent</title>
  <desc id="description">A colorful grocery basket surrounded by price, deal, delivery, and smart substitution cards.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f49"/>
      <stop offset="0.5" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#022c22" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1040" cy="70" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="1120" cy="310" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="100" cy="330" r="140" fill="#bef264" opacity="0.08"/>

  <g transform="translate(72 72)">
    <text x="0" y="46" fill="#ecfccb" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2">YOUR WEEKLY GROCERY COPILOT</text>
    <text x="0" y="108" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800">Grocery Shopping Agent</text>
    <text x="0" y="150" fill="#d1fae5" font-family="Arial, Helvetica, sans-serif" font-size="24">Find the best delivered basket, surface deals, and suggest smarter swaps.</text>

    <g transform="translate(0 188)" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
      <rect width="180" height="44" rx="22" fill="#ffffff" opacity="0.16"/>
      <text x="22" y="28" fill="#ffffff">Delivery-aware</text>
      <g transform="translate(194 0)">
        <rect width="150" height="44" rx="22" fill="#ffffff" opacity="0.16"/>
        <text x="22" y="28" fill="#ffffff">Deal hunter</text>
      </g>
      <g transform="translate(358 0)">
        <rect width="150" height="44" rx="22" fill="#ffffff" opacity="0.16"/>
        <text x="22" y="28" fill="#ffffff">Smart swaps</text>
      </g>
    </g>
  </g>

  <g transform="translate(852 74)" filter="url(#shadow)">
    <path d="M56 76h214l-18 196H74z" fill="url(#bag)"/>
    <path d="M104 92c0-62 118-62 118 0" fill="none" stroke="#fef3c7" stroke-width="18" stroke-linecap="round"/>
    <path d="M128 90c-8-42 18-78 48-82 6 42-8 72-48 82z" fill="#84cc16"/>
    <path d="M183 88c10-46 49-66 79-55-10 42-37 61-79 55z" fill="#22c55e"/>
    <circle cx="112" cy="158" r="30" fill="#ef4444"/>
    <path d="M110 128c4-12 15-18 25-19" fill="none" stroke="#14532d" stroke-width="7" stroke-linecap="round"/>
    <rect x="164" y="130" width="52" height="86" rx="16" fill="#f8fafc"/>
    <rect x="176" y="145" width="28" height="10" rx="5" fill="#38bdf8"/>
    <path d="M224 214c0-42 44-68 78-46-1 43-40 72-78 46z" fill="#a3e635"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" filter="url(#shadow)">
    <g transform="translate(790 32)">
      <rect width="166" height="48" rx="14" fill="#ffffff"/>
      <circle cx="25" cy="24" r="10" fill="#22c55e"/>
      <text x="44" y="29">Best total found</text>
    </g>
    <g transform="translate(1004 126)">
      <rect width="156" height="48" rx="14" fill="#ffffff"/>
      <circle cx="25" cy="24" r="10" fill="#f59e0b"/>
      <text x="44" y="29">Coupon applied</text>
    </g>
    <g transform="translate(746 278)">
      <rect width="166" height="48" rx="14" fill="#ffffff"/>
      <circle cx="25" cy="24" r="10" fill="#38bdf8"/>
      <text x="44" y="29">Swap for review</text>
    </g>
  </g>
</svg>

