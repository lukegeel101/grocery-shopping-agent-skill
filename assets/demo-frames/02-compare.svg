<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Grocery service comparison</title>
  <desc id="description">Two complete baskets are compared and a third basket is rejected for missing an item and breaking a protected coffee rule.</desc>
  <rect width="1200" height="675" rx="30" fill="#082f49"/>
  <circle cx="1100" cy="90" r="220" fill="#0f766e" opacity="0.48"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="88" fill="#bef264" font-size="19" font-weight="700" letter-spacing="3">DETERMINISTIC COMPARISON</text>
    <text x="70" y="145" fill="#ffffff" font-size="42" font-weight="800">Compare complete delivered totals</text>
    <text x="70" y="182" fill="#d1fae5" font-size="21">Mandatory fees and explicit coupons are included. Incomplete baskets are rejected.</text>
    <g transform="translate(70 235)">
      <rect width="330" height="325" rx="24" fill="#ffffff"/>
      <rect width="330" height="12" rx="6" fill="#38bdf8"/>
      <text x="28" y="58" fill="#0f172a" font-size="22" font-weight="800">Neighborhood Express</text>
      <text x="28" y="92" fill="#64748b" font-size="16">Baseline</text>
      <text x="28" y="150" fill="#0f172a" font-size="42" font-weight="800">$36.75</text>
      <text x="28" y="180" fill="#64748b" font-size="16">delivered total</text>
      <path d="M28 206h274" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="43" cy="244" r="12" fill="#22c55e"/><path d="M37 244l5 5 9-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="251" fill="#334155" font-size="18">4 of 4 items</text>
      <circle cx="43" cy="286" r="12" fill="#22c55e"/><path d="M37 286l5 5 9-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="293" fill="#334155" font-size="18">Rules passed</text>
    </g>
    <g transform="translate(435 215)">
      <rect width="330" height="365" rx="24" fill="#ecfccb"/>
      <rect width="330" height="12" rx="6" fill="#65a30d"/>
      <rect x="190" y="28" width="112" height="34" rx="17" fill="#16a34a"/><text x="246" y="51" fill="#fff" font-size="15" font-weight="800" text-anchor="middle">BEST TOTAL</text>
      <text x="28" y="92" fill="#14532d" font-size="22" font-weight="800">Value Cart</text>
      <text x="28" y="150" fill="#14532d" font-size="46" font-weight="800">$29.50</text>
      <text x="28" y="180" fill="#166534" font-size="16">delivered total</text>
      <path d="M28 206h274" stroke="#bbf7d0" stroke-width="2"/>
      <circle cx="43" cy="244" r="12" fill="#22c55e"/><path d="M37 244l5 5 9-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="251" fill="#14532d" font-size="18">4 of 4 items</text>
      <circle cx="43" cy="286" r="12" fill="#22c55e"/><path d="M37 286l5 5 9-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="293" fill="#14532d" font-size="18">2 swaps proposed</text>
      <text x="28" y="338" fill="#166534" font-size="16" font-weight="700">Includes $4.50 fee and $1 coupon</text>
    </g>
    <g transform="translate(800 235)">
      <rect width="330" height="325" rx="24" fill="#ffffff" opacity="0.95"/>
      <rect width="330" height="12" rx="6" fill="#f97316"/>
      <text x="28" y="58" fill="#0f172a" font-size="22" font-weight="800">Discount Warehouse</text>
      <text x="28" y="92" fill="#c2410c" font-size="16" font-weight="800">REJECTED</text>
      <g transform="translate(28 124)"><circle cx="14" cy="14" r="14" fill="#f97316"/><path d="M9 9l10 10m0-10L9 19" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="42" y="21" fill="#7c2d12" font-size="18">Yogurt unavailable</text></g>
      <g transform="translate(28 178)"><circle cx="14" cy="14" r="14" fill="#f97316"/><path d="M9 9l10 10m0-10L9 19" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="42" y="13" fill="#7c2d12" font-size="18">Protected coffee swap</text><text x="42" y="37" fill="#9a3412" font-size="16">violates the saved rule</text></g>
      <rect x="28" y="255" width="274" height="42" rx="12" fill="#fff7ed"/><text x="165" y="282" fill="#9a3412" font-size="16" font-weight="700" text-anchor="middle">Not eligible for selection</text>
    </g>
    <text x="1130" y="635" fill="#d1fae5" font-size="17" text-anchor="end">2 / 3</text>
  </g>
</svg>
