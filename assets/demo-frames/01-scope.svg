<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Grocery evaluation scope</title>
  <desc id="description">A fictional four-item grocery list is prepared for comparison across three delivery services.</desc>
  <rect width="1200" height="675" rx="30" fill="#082f49"/>
  <circle cx="1080" cy="80" r="210" fill="#0f766e" opacity="0.55"/>
  <circle cx="1120" cy="620" r="260" fill="#65a30d" opacity="0.20"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="88" fill="#bef264" font-size="19" font-weight="700" letter-spacing="3">MEASURED FICTIONAL DEMO</text>
    <text x="70" y="145" fill="#ffffff" font-size="42" font-weight="800">Build the complete weekly basket</text>
    <text x="70" y="182" fill="#d1fae5" font-size="21">Compare coverage, coupons, fees, and substitution rules before review.</text>
    <g transform="translate(70 226)">
      <rect width="655" height="365" rx="24" fill="#ffffff"/>
      <text x="32" y="50" fill="#0f172a" font-size="18" font-weight="800">THIS WEEK'S REQUIRED ITEMS</text>
      <g font-size="20" fill="#0f172a">
        <g transform="translate(32 82)"><rect width="591" height="58" rx="14" fill="#f0fdf4"/><circle cx="30" cy="29" r="12" fill="#22c55e"/><path d="M24 29l5 5 9-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="36">Rice</text><text x="540" y="36" fill="#64748b" text-anchor="end">swaps allowed</text></g>
        <g transform="translate(32 150)"><rect width="591" height="58" rx="14" fill="#f0fdf4"/><circle cx="30" cy="29" r="12" fill="#22c55e"/><path d="M24 29l5 5 9-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="36">Vegetables</text><text x="540" y="36" fill="#64748b" text-anchor="end">swaps allowed</text></g>
        <g transform="translate(32 218)"><rect width="591" height="58" rx="14" fill="#fff7ed"/><circle cx="30" cy="29" r="12" fill="#f59e0b"/><path d="M24 29l5 5 9-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="36">Coffee</text><text x="540" y="36" fill="#9a3412" text-anchor="end" font-weight="700">protected brand</text></g>
        <g transform="translate(32 286)"><rect width="591" height="58" rx="14" fill="#f0fdf4"/><circle cx="30" cy="29" r="12" fill="#22c55e"/><path d="M24 29l5 5 9-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="36">Yogurt</text><text x="540" y="36" fill="#64748b" text-anchor="end">swaps allowed</text></g>
      </g>
    </g>
    <g transform="translate(760 226)">
      <rect width="370" height="110" rx="20" fill="#ffffff" opacity="0.96"/>
      <text x="28" y="42" fill="#64748b" font-size="16" font-weight="700">SERVICES TO EVALUATE</text>
      <text x="28" y="82" fill="#0f172a" font-size="34" font-weight="800">3 fictional services</text>
      <g transform="translate(0 130)"><rect width="370" height="110" rx="20" fill="#ffffff" opacity="0.96"/><text x="28" y="42" fill="#64748b" font-size="16" font-weight="700">REQUIRED COVERAGE</text><text x="28" y="82" fill="#0f172a" font-size="34" font-weight="800">4 of 4 items</text></g>
      <g transform="translate(0 260)"><rect width="370" height="105" rx="20" fill="#ecfccb"/><circle cx="42" cy="52" r="20" fill="#16a34a"/><path d="M33 52l7 7 13-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="47" fill="#14532d" font-size="18" font-weight="800">Review only</text><text x="78" y="74" fill="#166534" font-size="16">No order will be placed</text></g>
    </g>
    <text x="1130" y="635" fill="#d1fae5" font-size="17" text-anchor="end">1 / 3</text>
  </g>
